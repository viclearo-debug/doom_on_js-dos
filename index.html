<!DOCTYPE html>
<html lang="en-us">

  <head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="description" content="Play dehut doom in your browser.">
  <meta name="keywords" content="dehut doom,DOOM,pc,game,javascript">
  <title>dehut doom</title>
  <meta property="og:title" content="dehut doom" />
  <meta property="og:description" content="Play dehut doom in your browser." />
  <meta property="og:type" content="game" />
  <meta property="og:image" content="DOOM.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="app.css">
  <!-- FAVICON -->
  <script type="text/javascript" src="js-dos-api.js"></script>
  </head>

  <body style="background-color:#121212; color: white">
   
<style>
    #DOOM > .dosbox-container { width: 640px; height: 400px; }
    #DOOM > .dosbox-container > .dosbox-overlay { background: url("DOOM.png"); }
    #DOOM > .dosbox-container > .dosbox-overlay > .dosbox-start {
        border-radius: 17px 17px 17px 17px;
        -moz-border-radius: 17px 17px 17px 17px;
        -webkit-border-radius: 17px 17px 17px 17px;
        border: 0px solid #000000;
        background-color: rgba(90, 90, 90, 0.57);
        padding: 5px;
        text-align: center;
        vertical-align: middle;
        width: 10em;
        margin: 0 auto;
    }
    a:link {color:white}
</style>
<center>
<h1>dehut doom</h1>
<div style="margin-top:20px;" id="DOOM" class="dosbox-default"></div>
<p><br /><a id="fullscreen_DOOM" href="javascript: void 0;" class="fa-solid fa-expand"></a>&nbsp;&nbsp;FULLSCREEN</p>

<script type="text/javascript">
  var dosbox_DOOM = new Dosbox({
    id: "DOOM",
    onload: function (dosbox) {
      dosbox_DOOM.run("DOOM-@evilution.zip", "./DOOM/DOOM.EXE");
    },
    onrun: function (dosbox, app) {
      console.log("App '" + app + "' is running");
    }
  });

  document.getElementById("fullscreen_DOOM").addEventListener("click", function() {
    dosbox_DOOM.requestFullScreen();
  });
</script>
    </center>
  </body>
</html>
